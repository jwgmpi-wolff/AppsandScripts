<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>StockStream Local</title>
  <style>
    :root { font-family: ui-sans-serif, system-ui, sans-serif; color: #f5f7fa; background: #111820; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; }
    main { width: min(760px, calc(100% - 40px)); padding: 48px 0; }
    h1 { font-size: clamp(2.2rem, 8vw, 4.8rem); margin: 0 0 12px; letter-spacing: 0; }
    p { color: #b8c4cf; line-height: 1.6; }
    a { display: inline-block; margin-top: 20px; padding: 14px 20px; color: #07130d; background: #55d68b; border-radius: 6px; font-weight: 700; text-decoration: none; }
    img { display: block; width: min(360px, 100%); margin-top: 36px; border: 1px solid #33414d; border-radius: 8px; }
    small { display: block; margin-top: 20px; color: #8493a1; }
  </style>
</head>
<body>
  <main>
    <h1>StockStream Local</h1>
    <p>A private, device-first Android stock watchlist with direct market-data access, portfolio imports, rotating views, and explicit quote-quality labels.</p>
    <a href="app-debug.apk" download>Download Android APK</a>
    <small>Android 8.0 or newer. This development APK contains no API key; configure a provider after installation.</small>
    <img src="stock-stream-local.png" alt="StockStream Local running on Android">
  </main>
</body>
</html>
