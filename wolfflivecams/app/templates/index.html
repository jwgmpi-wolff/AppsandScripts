<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Wolff Live Cams</title>
  <style>
    :root {
      --ink: #0e1a2b;
      --sky: #7ad7ff;
      --glass: rgba(255, 255, 255, 0.78);
      --edge: #90d8ff;
      --accent: #1266d6;
      --paper: #eff8ff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", "Aptos", sans-serif;
      background: radial-gradient(circle at 20% 0%, #c7efff 0%, #eff8ff 35%, #d9edff 100%);
      color: var(--ink);
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }
    .card {
      width: min(720px, 100%);
      border: 1px solid var(--edge);
      background: var(--glass);
      backdrop-filter: blur(6px);
      border-radius: 18px;
      padding: 28px;
      box-shadow: 0 16px 40px rgba(18, 102, 214, 0.18);
      animation: rise 480ms ease-out both;
    }
    h1 {
      margin: 0 0 10px;
      font-size: clamp(1.8rem, 4vw, 2.6rem);
      letter-spacing: 0.01em;
    }
    .pill {
      display: inline-block;
      border: 1px solid #8de0ae;
      background: #e7fff0;
      color: #0f7b41;
      font-weight: 600;
      border-radius: 999px;
      padding: 6px 12px;
      margin: 8px 0 18px;
    }
    p { line-height: 1.5; margin: 0 0 14px; }
    a {
      display: inline-block;
      margin-top: 8px;
      color: #fff;
      text-decoration: none;
      background: linear-gradient(120deg, var(--accent), #0f8ad3);
      border-radius: 10px;
      padding: 10px 14px;
      font-weight: 600;
    }
    @keyframes rise {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>{{ project }}</h1>
    <span class="pill">Status: {{ status }}</span>
    <p>The project is running locally or on Azure App Service.</p>
    <p>Use the health endpoint to verify runtime checks.</p>
    <a href="/health">Check Health</a>
  </main>
</body>
</html>
