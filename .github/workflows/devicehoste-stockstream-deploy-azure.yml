name: Build and deploy StockStream Local

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  PROJECT_DIR: devicehoste_stock_streamer

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: pwsh
        run: .\gradlew.bat :app:assembleDebug --console=plain

      - name: Prepare distribution
        working-directory: ${{ env.PROJECT_DIR }}
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path distribution -Force | Out-Null
          Copy-Item app/build/outputs/apk/debug/app-debug.apk distribution/app-debug.apk
          Copy-Item deployment/site/index.html distribution/index.html
          Copy-Item docs/screenshots/stock-stream-local.png distribution/stock-stream-local.png

      - uses: actions/upload-artifact@v4
        with:
          name: stockstream-distribution
          path: devicehoste_stock_streamer/distribution
          if-no-files-found: error

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: stockstream-distribution
          path: dist

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Provision distribution site
        id: provision
        shell: bash
        run: |
          set -euo pipefail
          az group create \
            --name "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --location "${{ vars.AZURE_LOCATION }}" \
            --only-show-errors
          az deployment group create \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --template-file "${PROJECT_DIR}/infra/main.bicep" \
            --name stockstream-distribution \
            --only-show-errors
          storage_account=$(az deployment group show \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --name stockstream-distribution \
            --query properties.outputs.storageAccountName.value \
            --output tsv)

          az storage blob service-properties update \
            --account-name "$storage_account" \
            --auth-mode login \
            --static-website \
            --404-document index.html \
            --index-document index.html \
            --only-show-errors

          website_url=$(az storage account show \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --name "$storage_account" \
            --query primaryEndpoints.web \
            --output tsv)
          echo "storage_account=$storage_account" >> "$GITHUB_OUTPUT"
          echo "website_url=$website_url" >> "$GITHUB_OUTPUT"

      - name: Publish site and APK
        shell: bash
        run: |
          set -euo pipefail
          az storage blob upload-batch \
            --account-name "${{ steps.provision.outputs.storage_account }}" \
            --auth-mode login \
            --destination '$web' \
            --source dist \
            --overwrite \
            --only-show-errors
          echo "Published to ${{ steps.provision.outputs.website_url }}" >> "$GITHUB_STEP_SUMMARY"
