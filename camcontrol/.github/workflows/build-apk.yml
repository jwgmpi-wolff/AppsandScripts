name: Build Android APK

on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/build-apk.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
      - name: Sign APK (debug keystore)
        run: |
          cd android/app/build/outputs/apk/release
          jarsigner -verbose -keystore ~/.android/debug.keystore \
            -storepass android -keypass android \
            app-release-unsigned.apk androiddebugkey
          mv app-release-unsigned.apk CamControl.apk
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CamControl-APK
          path: android/app/build/outputs/apk/release/CamControl.apk
      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: apk-${{ github.run_number }}
          name: CamControl APK (build ${{ github.run_number }})
          files: android/app/build/outputs/apk/release/CamControl.apk
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
