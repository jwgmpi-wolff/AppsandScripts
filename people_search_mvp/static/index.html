<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Live Stream Finder</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <div class="hero">
      <h1>Live Stream Finder</h1>
    </div>
    <div class="container">
      <div class="panel">
        <label>Seed URLs (one per line)</label>
        <textarea id="seeds" placeholder="https://example.com"></textarea>
        <label>Pattern (wildcard * supported)</label>
        <input id="pattern" placeholder="*youtube.com*" />
        <button id="scan">Scan</button>
        <button id="clear">Clear Recent</button>
      </div>

      <div class="panel">
        <h2>Recent Results</h2>
        <div id="results"></div>
      </div>

      <div class="panel">
        <h2>Saved Links</h2>
        <input id="savedQuery" placeholder="search saved" />
        <button id="searchSaved">Search</button>
        <div id="saved"></div>
      </div>
    </div>
    <script src="/static/app.js"></script>
  </body>
</html>
